version: '3.8'

services:
  inventory-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db-mongo
      - APP_ENV=production
    depends_on:
      - db-mongo

  db-mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=ShopEasySecurePassword123
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: